[project]
name = "mwa-jaxbeam"
version = "0.1.0"
description = "Experiments with native JAX implementations of MWA beam models for fast, differentiable inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Chokshi", email = "aman.chokshi@mcgill.ca" }]
keywords = [
    "radio astronomy",
    "MWA",
    "beams",
    "jax",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.6.2",
    "numpy>=2.2.6",
]

[dependency-groups]
dev = [
    "astropy>=6.1.7",
]
